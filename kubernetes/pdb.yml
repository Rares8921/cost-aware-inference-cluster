apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: router-pdb
  namespace: inference-cluster
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: router
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: inference-cluster
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
