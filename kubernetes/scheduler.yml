apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: inference-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: inference-scheduler:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: LOG_LEVEL
          value: "INFO"
        - name: AUTOSCALE_ENABLED
          value: "true"
        - name: MIN_WORKERS
          value: "2"
        - name: MAX_WORKERS
          value: "10"
        - name: TARGET_QUEUE_DEPTH
          value: "50"
        - name: TARGET_P95_LATENCY_MS
          value: "50"
        - name: COST_PER_GPU_HOUR
          value: "2.5"
        - name: MAX_COST_PER_HOUR
          value: "20"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: inference-cluster
spec:
  selector:
    app: scheduler
  ports:
  - port: 8001
    targetPort: 8001
