apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: inference-cluster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: inference-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: SCHEDULER_URL
          value: "http://scheduler:8001"
        - name: LOG_LEVEL
          value: "INFO"
        - name: BATCH_SIZE_MAX
          value: "32"
        - name: BATCH_TIMEOUT_MS
          value: "50"
        - name: MODEL_NAME
          value: "distilbert-base-uncased"
        - name: WORKER_WARM_POOL
          value: "true"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: inference-cluster
spec:
  selector:
    app: worker
  clusterIP: None
  ports:
  - port: 8002
    targetPort: 8002
