global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'inference-cluster'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'router'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['router:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'router'

  - job_name: 'scheduler'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['scheduler:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'scheduler'

  - job_name: 'workers'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['worker:8002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):(\d+)'
        replacement: 'worker-${1}'
